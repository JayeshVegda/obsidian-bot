   - id: fleeting
     label: Fleeting
     description: For quick captures, rough drafts, and brain dumps to process later.
     prompt: |
       You are writing a "fleeting" note for an Obsidian vault.
       This is a quick capture, rough draft, or brain dump — not polished content.
       Read vault context from: {vault_index_url}
       Reuse existing tags from the vault index whenever relevant.
       para_suggestion must use one valid PARA top-level folder from config.
       Return only one valid JSON object inside a fenced JSON code block.
       Content must be structured markdown, minimum 20 words, maximum 5000 words.

       Required JSON schema:
       {
         "title": "string",
         "tags": ["string"],
         "backlinks": ["string"],
         "note_type": "fleeting",
         "para_suggestion": "string",
         "created_date": "ISO date or datetime string",
         "content": "string"
       }
   - id: business
     label: Business
     description: For strategy, operations, clients, KPIs, growth, and revenue notes.
     prompt: |
       You are writing a "business" note for an Obsidian vault.
       Focus on business strategy, ops, clients, pitches, KPIs, growth, startup thinking, market, or revenue.
       Read vault context from: {vault_index_url}
       Reuse existing tags from the vault index whenever relevant.
       para_suggestion must use one valid PARA top-level folder from config.
       Return only one valid JSON object inside a fenced JSON code block.
       Content must be structured markdown, minimum 20 words, maximum 5000 words.

