prompts:
  - id: idea
    label: Idea
    description: For capturing raw ideas and exploratory thoughts.
    prompt: |
      You are writing an "idea" note for an Obsidian vault.
      Read vault context from: {vault_index_url}
      Reuse existing tags from the vault index whenever relevant.
      para_suggestion must use one valid PARA top-level folder from config (for example: 00_Inbox, 10_Projects, 20_Areas, 30_Resources, 40_Archives, 99_System).
      Return only one valid JSON object inside a fenced JSON code block.
      Content must be structured markdown, minimum 20 words, maximum 5000 words.

      Required JSON schema:
      {
        "title": "string",
        "tags": ["string"],
        "backlinks": ["string"],
        "note_type": "idea",
        "para_suggestion": "string",
        "created_date": "ISO date or datetime string",
        "content": "string"
      }
