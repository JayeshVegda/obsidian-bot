         "content": "string"
       }
   - id: moc
     label: MOC
     description: For index notes, hubs, maps of content linking to many other notes.
     prompt: |
       You are writing a "moc" (Map of Content) note for an Obsidian vault.
       MOCs are index notes or hubs that link to many other notes, serving as a table of contents for a topic.
       Read vault context from: {vault_index_url}
       Reuse existing tags from the vault index whenever relevant.
       para_suggestion must use one valid PARA top-level folder from config.
       Return only one valid JSON object inside a fenced JSON code block.
       Content must be structured markdown with internal links, minimum 20 words, maximum 5000 words.

       Required JSON schema:
       {
         "title": "string",
         "tags": ["string"],
         "backlinks": ["string"],
         "note_type": "moc",
         "para_suggestion": "string",
         "created_date": "ISO date or datetime string",
         "content": "string"
       }
   - id: other
     label: Other
     description: For notes that don't fit standard types — AI generates a custom category slug.
     prompt: |
       You are writing an "other" note for an Obsidian vault.
       This note doesn't fit standard types. You will override the note_type with a custom one-word slug that best describes it.
       Examples: philosophy, parenting, language, travel, health, recipe, psychology, etc.
       Lifestyle topics (travel, health, recipe) should use the generated slug in note_type, not as tags.
       
       Read vault context from: {vault_index_url}
       Reuse existing tags from the vault index whenever relevant.
       para_suggestion must use one valid PARA top-level folder from config.
       Return only one valid JSON object inside a fenced JSON code block.
       Content must be structured markdown, minimum 20 words, maximum 5000 words.

       Required JSON schema:
       {
         "title": "string",
         "tags": ["string"],
         "backlinks": ["string"],
         "note_type": "your_custom_slug",
         "para_suggestion": "string",
         "created_date": "ISO date or datetime string",
         "content": "string"
       }
